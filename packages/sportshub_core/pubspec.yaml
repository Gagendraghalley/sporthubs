name: sportshub_core
description: What every SportsHub module shares - accounts, profiles, venues and their staff, payments, notifications, the module contract, the router and the app shell.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.18.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  shared_preferences: ^2.3.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  # Used as Image.asset(..., package: 'sportshub_core') (SportsHubLogo).
  assets:
    - assets/images/
