name: sportshub_core
description: What every SportsHub module shares - accounts, profiles, venues and their staff, payments, notifications, the module contract, the router and the app shell.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.18.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  shared_preferences: ^2.3.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  # Used as Image.asset(..., package: 'sportshub_core') (SportsHubLogo, and
  # the sign-in pages' photo, AuthLayout.photo: assets/PHOTO_CREDITS.md).
  assets:
    - assets/images/
    - assets/auth/
  fonts:
    # The platform's typeface, every service's (brandFont, used as
    # 'packages/sportshub_core/PlusJakartaSans'). Plus Jakarta Sans, SIL Open
    # Font License (assets/fonts/OFL.txt).
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
